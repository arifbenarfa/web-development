<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">
    <title>Contact | Centria Edu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">centria <span>edu</span></div>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#topics">Topics</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="topics" id="contact">
            <div class="container">
                <span class="label">Get in touch</span>
                <h1>Contact us</h1>
                <p class="contact-intro">Send us a message using the form below. Fields marked as required must be completed.</p>

                <form class="card contact-form" action="https://httpbin.org/post" method="post">
                    <div class="form-field">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" autocomplete="name" required>
                    </div>

                    <div class="form-field">
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>

                    <div class="form-field">
                        <label for="phone">Phone number (optional)</label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel">
                    </div>

                    <div class="form-field">
                        <label for="subject">Contact subject</label>
                        <select id="subject" name="subject" required>
                            <option value="">Choose a subject</option>
                            <option value="feedback">Feedback</option>
                            <option value="question">Question</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <fieldset>
                        <legend class="form-legend">Preferred contact method</legend>
                        <div class="radio-options">
                            <label for="method-email"><input type="radio" id="method-email" name="contact_method" value="email" required> Email</label>
                            <label for="method-phone"><input type="radio" id="method-phone" name="contact_method" value="phone"> Phone</label>
                        </div>
                    </fieldset>

                    <div class="form-field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>

                    <button class="button" type="submit">Submit</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container"><p>&copy; 2026 Centria Edu</p></div>
    </footer>
</body>
</html>
